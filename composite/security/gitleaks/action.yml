name: GitLeaks Secret Scanning
description: >
  Performs GitLeaks secret scanning with support for custom rulesets.
  Detects hardcoded secrets and credentials in source code.
  Generates SARIF reports for GitHub Security tab integration.
author: SRE CICD Team
inputs:
  src-path:
    description: >
      Path to the source code directory to scan.
      Relative to repository root.
      Default: current repository root
    required: false
    default: "."
    type: string

  ruleset-file:
    description: >
      Ruleset configuration option.
      Options: 'default' (uses built-in rules) or path to custom ruleset file.
      Example: '.gitleaks/custom-rules.toml'
    required: false
    default: "default"
    type: string

  custom-ruleset-content:
    description: >
      TOML format custom ruleset content as multi-line string.
      When provided, takes precedence over ruleset-file parameter.
      Useful for inline ruleset definitions in workflows.
    required: false
    type: string

  verbose:
    description: >
      Enable verbose output for detailed scanning information.
      Helps with debugging and understanding detection logic.
    required: false
    default: "true"
    type: string

  redact:
    description: >
      Redact detected secrets in console output.
      Security best practice: always keep enabled for sensitive data.
    required: false
    default: "true"
    type: string

  fetch-depth:
    description: >
      Git fetch depth for scanning.
      Use 0 for full history, positive number for recent commits.
      Default: 0 (full history)
    required: false
    default: "0"
    type: string

  fail-on-detection:
    description: >
      Fail the workflow step if secrets are detected.
      Options: 'true' (fail on any detection) or 'false' (continue on detection)
    required: false
    default: "true"
    type: string

  max-target-megabytes:
    description: >
      Maximum target size in MB for scanning.
      Limits scanning scope to avoid performance issues with large files.
      Default: 2000 MB
    required: false
    default: "2000"
    type: string

  gitleaks-version:
    description: >
      Version of GitLeaks to use.
      Format: 'vX.Y.Z' or 'latest'
      Default: 'v8.30.1'
    required: false
    default: "v8.30.1"
    type: string

  artifact-retention:
    description: >
      Number of days to retain scan artifacts and reports.
      Default: 30 days
    required: false
    default: "30"
    type: string

  sarif-upload:
    description: >
      Upload SARIF results to GitHub Security tab.
      Requires GitHub Advanced Security.
    required: false
    default: "false"
    type: string

  sarif-output-directory:
    description: >
      Custom directory for SARIF reports when Security tab is unavailable.
      Relative to repository root.
      Useful for private repositories or enterprise environments.
      Default: .gitleaks/reports
    required: false
    default: ".gitleaks/reports"
    type: string

outputs:
  report-path:
    description: >
      Path to the generated SARIF report file
    value: ${{ steps.gitleaks-scan.outputs.report-path }}

  findings-count:
    description: >
      Number of secrets detected in the scan
    value: ${{ steps.gitleaks-scan.outputs.findings-count }}

  scan-status:
    description: >
      Status of the scan: 'success' or 'secrets-detected'
    value: ${{ steps.gitleaks-scan.outputs.scan-status }}

  report-exists:
    description: >
      Whether SARIF report was generated: 'true' or 'false'
    value: ${{ steps.gitleaks-scan.outputs.report-exists }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        echo "::group::Input Validation"
        echo "Source Path: ${{ inputs.src-path }}"
        echo "Ruleset: ${{ inputs.ruleset-file }}"
        echo "Verbose: ${{ inputs.verbose }}"
        echo "Redact: ${{ inputs.redact }}"
        echo "Fail on Detection: ${{ inputs.fail-on-detection }}"
        echo "GitLeaks Version: ${{ inputs.gitleaks-version }}"
        echo "::endgroup::"

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Set up scan directories
      shell: bash
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/.gitleaks/reports"
        mkdir -p "${GITHUB_WORKSPACE}/.gitleaks/config"
        mkdir -p "${GITHUB_WORKSPACE}/${{ inputs.sarif-output-directory }}"
        echo "Scan workspace: ${GITHUB_WORKSPACE}"
        echo "SARIF output directory: ${{ inputs.sarif-output-directory }}"

    - name: Download and setup GitLeaks
      id: setup-gitleaks
      shell: bash
      run: |
        set -e
        GITLEAKS_VERSION="${{ inputs.gitleaks-version }}"

        # Determine download URL based on OS and version
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)

        case "$ARCH" in
          x86_64)
            ARCH="x64"
            ;;
          aarch64)
            ARCH="arm64"
            ;;
        esac

        if [ "$OS" = "darwin" ]; then
          OS="darwin"
        fi

        # Build download URL (note: newer versions use underscore format and drop the 'v' prefix)
        DOWNLOAD_URL="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_${OS}_${ARCH}.tar.gz"

        echo "Downloading GitLeaks from: ${DOWNLOAD_URL}"

        cd "${GITHUB_WORKSPACE}/.gitleaks"
        curl -LfS -o gitleaks.tar.gz "${DOWNLOAD_URL}" || {
          echo "::error::Failed to download GitLeaks from ${DOWNLOAD_URL}"
          echo "::error::Please verify the version exists at: https://github.com/gitleaks/gitleaks/releases"
          exit 1
        }

        tar -xzf gitleaks.tar.gz
        chmod +x gitleaks

        # Verify installation
        ./gitleaks version

        echo "gitleaks-bin=${GITHUB_WORKSPACE}/.gitleaks/gitleaks" >> $GITHUB_OUTPUT

    - name: Prepare custom ruleset from content
      if: inputs.custom-ruleset-content != ''
      shell: bash
      run: |
        cat > "${GITHUB_WORKSPACE}/.gitleaks/config/custom-ruleset.toml" << 'RULESET_EOF'
        ${{ inputs.custom-ruleset-content }}
        RULESET_EOF
        echo "Custom ruleset created from content"

    - name: Prepare ruleset configuration
      shell: bash
      run: |
        RULESET_FILE="${{ inputs.ruleset-file }}"
        CONFIG_DIR="${GITHUB_WORKSPACE}/.gitleaks/config"

        if [ -n "${{ inputs.custom-ruleset-content }}" ]; then
          echo "gitleaks-config=${CONFIG_DIR}/custom-ruleset.toml" >> $GITHUB_ENV
          echo "Using custom ruleset from content"
        elif [ "$RULESET_FILE" = "default" ]; then
          echo "Using GitLeaks default ruleset"
          echo "gitleaks-config=" >> $GITHUB_ENV
        elif [ -f "$RULESET_FILE" ]; then
          echo "gitleaks-config=$(pwd)/${RULESET_FILE}" >> $GITHUB_ENV
          echo "Using custom ruleset file: ${RULESET_FILE}"
        else
          echo "::warning::Ruleset file not found: ${RULESET_FILE}, using default"
          echo "gitleaks-config=" >> $GITHUB_ENV
        fi

    - name: Perform GitLeaks scan
      id: gitleaks-scan
      shell: bash
      continue-on-error: true
      run: |
        set -e

        GITLEAKS_BIN="${{ steps.setup-gitleaks.outputs.gitleaks-bin }}"
        SRC_PATH="${{ inputs.src-path }}"
        REPORT_PATH="${GITHUB_WORKSPACE}/.gitleaks/reports/gitleaks-report.sarif"
        VERBOSE_FLAG=""
        REDACT_FLAG=""

        [ "${{ inputs.verbose }}" = "true" ] && VERBOSE_FLAG="--verbose"
        [ "${{ inputs.redact }}" = "true" ] && REDACT_FLAG="--redact"

        # Build config flag
        CONFIG_FLAG=""
        GITLEAKS_CONFIG="${{ env.gitleaks-config }}"
        if [ -n "$GITLEAKS_CONFIG" ]; then
          CONFIG_FLAG="--config=$GITLEAKS_CONFIG"
        fi

        echo "::group::GitLeaks Scan Details"
        echo "Binary: ${GITLEAKS_BIN}"
        echo "Source: ${SRC_PATH}"
        echo "Config: ${CONFIG_FLAG:-'(default)'}"
        echo "Report: ${REPORT_PATH}"
        echo "::endgroup::"

        # Execute scan
        SCAN_OUTPUT=$( \
          "$GITLEAKS_BIN" detect \
            --source="${SRC_PATH}" \
            --report-format=sarif \
            --report-path="${REPORT_PATH}" \
            --max-target-megabytes=${{ inputs.max-target-megabytes }} \
            $VERBOSE_FLAG \
            $REDACT_FLAG \
            $CONFIG_FLAG \
            2>&1 || true
        )

        echo "$SCAN_OUTPUT"

        # Parse findings count
        FINDINGS_COUNT=$(echo "$SCAN_OUTPUT" | grep -oP '(?<=Found \d+ secret' | wc -l || echo "0")
        if [ "$FINDINGS_COUNT" = "0" ]; then
          FINDINGS_COUNT=$(echo "$SCAN_OUTPUT" | grep -oP 'Found \K[0-9]+' || echo "0")
        fi

        if [ -f "$REPORT_PATH" ]; then
          echo "report-path=${REPORT_PATH}" >> $GITHUB_OUTPUT
          echo "report-exists=true" >> $GITHUB_OUTPUT

          # Count findings in SARIF
          if command -v jq &> /dev/null; then
            FINDINGS_COUNT=$(jq '.runs[0].results | length' "$REPORT_PATH" || echo "0")
          fi
        else
          echo "report-exists=false" >> $GITHUB_OUTPUT
          FINDINGS_COUNT="0"
        fi

        echo "findings-count=${FINDINGS_COUNT}" >> $GITHUB_OUTPUT

        if [ "$FINDINGS_COUNT" -gt 0 ]; then
          echo "scan-status=secrets-detected" >> $GITHUB_OUTPUT
        else
          echo "scan-status=success" >> $GITHUB_OUTPUT
        fi

        # Exit based on fail-on-detection setting
        if [ "$FINDINGS_COUNT" -gt 0 ] && [ "${{ inputs.fail-on-detection }}" = "true" ]; then
          echo "::error::GitLeaks detected ${FINDINGS_COUNT} secret(s)"
          exit 1
        fi

    - name: Copy SARIF to custom directory
      if: steps.gitleaks-scan.outputs.report-exists == 'true' && inputs.sarif-output-directory != '.gitleaks/reports'
      shell: bash
      run: |
        if [ -f "${{ steps.gitleaks-scan.outputs.report-path }}" ]; then
          cp "${{ steps.gitleaks-scan.outputs.report-path }}" \
             "${GITHUB_WORKSPACE}/${{ inputs.sarif-output-directory }}/gitleaks-report.sarif"
          echo "SARIF report copied to custom directory: ${{ inputs.sarif-output-directory }}"
        fi

    - name: Display scan summary
      if: always()
      shell: bash
      run: |
        echo "::group::GitLeaks Scan Summary"
        echo "Status: ${{ steps.gitleaks-scan.outputs.scan-status }}"
        echo "Findings: ${{ steps.gitleaks-scan.outputs.findings-count }}"
        echo "Report: ${{ steps.gitleaks-scan.outputs.report-path }}"
        echo "Report Exists: ${{ steps.gitleaks-scan.outputs.report-exists }}"
        echo "SARIF Output Directory: ${{ inputs.sarif-output-directory }}"
        echo "::endgroup::"

    - name: Upload SARIF to GitHub Security
      if: steps.gitleaks-scan.outputs.report-exists == 'true' && inputs.sarif-upload == 'true'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.gitleaks-scan.outputs.report-path }}
        category: gitleaks-scan
        wait-for-processing: true
      continue-on-error: true

    - name: Upload scan artifacts from default directory
      if: always() && inputs.sarif-output-directory == '.gitleaks/reports'
      uses: actions/upload-artifact@v4
      with:
        name: gitleaks-reports-${{ github.run_id }}
        path: ${{ github.workspace }}/.gitleaks/reports/
        retention-days: ${{ inputs.artifact-retention }}
        if-no-files-found: ignore
      continue-on-error: true

    - name: Upload scan artifacts from custom directory
      if: always() && inputs.sarif-output-directory != '.gitleaks/reports'
      uses: actions/upload-artifact@v4
      with:
        name: gitleaks-reports-${{ github.run_id }}
        path: ${{ github.workspace }}/${{ inputs.sarif-output-directory }}/
        retention-days: ${{ inputs.artifact-retention }}
        if-no-files-found: ignore
      continue-on-error: true
